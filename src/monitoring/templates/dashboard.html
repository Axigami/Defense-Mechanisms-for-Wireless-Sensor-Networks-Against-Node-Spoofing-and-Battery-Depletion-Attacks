<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSN Real-time Monitoring Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        .stat-card h3 {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-card .unit {
            font-size: 0.9em;
            color: #999;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-good { background: #d4edda; color: #155724; }
        .status-warning { background: #fff3cd; color: #856404; }
        .status-danger { background: #f8d7da; color: #721c24; }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        #chartContainer {
            height: 400px;
            position: relative;
        }

        .node-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .node-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .node-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .node-item.cluster-1 { border-left-color: #e74c3c; }
        .node-item.cluster-2 { border-left-color: #3498db; }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .node-id {
            font-size: 1.2em;
            font-weight: bold;
            color: #667eea;
        }

        .cluster-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            color: white;
        }

        .cluster-1-badge { background: #e74c3c; }
        .cluster-2-badge { background: #3498db; }

        .node-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 0.9em;
        }

        .metric {
            display: flex;
            justify-content: space-between;
        }

        .metric-label {
            color: #666;
            font-weight: 500;
        }

        .metric-value {
            font-weight: bold;
            color: #333;
        }

        .energy-bar {
            width: 100%;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .energy-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s ease, background-color 0.5s ease;
        }

        .energy-high { background: linear-gradient(90deg, #2ecc71, #27ae60); }
        .energy-medium { background: linear-gradient(90deg, #f39c12, #e67e22); }
        .energy-low { background: linear-gradient(90deg, #e74c3c, #c0392b); }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }

        canvas {
            max-width: 100%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .updating {
            animation: pulse 1s infinite;
        }

        /* Responsive */
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            h1 {
                font-size: 1.8em;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Dead node styling */
        .node-dead {
            opacity: 0.6;
            background: #ffe6e6 !important;
            border-left-color: #721c24 !important;
        }

        .node-dead .node-id {
            color: #721c24;
            text-decoration: line-through;
        }

        .node-dead:hover {
            background: #ffd6d6 !important;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WSN Real-time Monitoring Dashboard</h1>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Nodes</h3>
                <div class="value" id="totalNodes">0</div>
                <div class="unit">nodes</div>
            </div>

            <div class="stat-card">
                <h3>Packet Delivery Ratio</h3>
                <div class="value" id="pdr">0%</div>
                <span class="status-badge status-good" id="pdrStatus">Excellent</span>
            </div>

            <div class="stat-card">
                <h3>Average Latency</h3>
                <div class="value" id="avgLatency">0</div>
                <div class="unit">ms</div>
            </div>

            <div class="stat-card">
                <h3>Average Energy</h3>
                <div class="value" id="avgEnergy">0</div>
                <div class="unit">mJ</div>
            </div>

            <div class="stat-card">
                <h3>Average Temperature</h3>
                <div class="value" id="avgTemp">0</div>
                <div class="unit">°C</div>
            </div>

            <div class="stat-card">
                <h3>Network Version</h3>
                <div class="value" id="version" style="font-size: 1.8em;">-</div>
                <div class="unit">Sink ID: <span id="sinkId">-</span></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Charts Panel -->
            <div class="panel">
                <h2>Real-time Metrics</h2>
                <div id="chartContainer">
                    <canvas id="metricsChart"></canvas>
                </div>
            </div>

            <!-- Node List Panel -->
            <div class="panel">
                <h2>Active Nodes</h2>
                
                <!-- Search Box -->
                <div style="margin-bottom: 15px;">
                    <input type="text" id="nodeSearch" placeholder="Search node ID..." 
                           style="width: 100%; padding: 10px; border: 2px solid #667eea; border-radius: 8px; font-size: 14px;">
                </div>
                
                <div class="node-list" id="nodeList">
                    <div class="loading">Waiting for data...</div>
                </div>
            </div>
        </div>

        <div class="last-updated">
            Last updated: <span id="lastUpdate">Never</span>
        </div>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <script>
        // Chart setup
        const ctx = document.getElementById('metricsChart').getContext('2d');
        let metricsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Avg Energy (mJ)',
                        data: [],
                        borderColor: '#2ecc71',
                        backgroundColor: 'rgba(46, 204, 113, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y',
                    },
                    {
                        label: 'Avg Temperature (°C)',
                        data: [],
                        borderColor: '#e74c3c',
                        backgroundColor: 'rgba(231, 76, 60, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y1',
                    },
                    {
                        label: 'Avg Latency (ms)',
                        data: [],
                        borderColor: '#3498db',
                        backgroundColor: 'rgba(52, 152, 219, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y2',
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Energy (mJ)'
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: 'Temperature (°C)'
                        },
                        grid: {
                            drawOnChartArea: false,
                        },
                    },
                    y2: {
                        type: 'linear',
                        display: false,
                        position: 'right',
                    }
                }
            }
        });

        // Global variable to store all nodes
        let allNodesData = [];

        // Data update function
        async function updateDashboard() {
            try {
                const response = await fetch('/api/network');
                const data = await response.json();
                
                // Update stats
                const activeNodes = data.active_nodes || data.nodes.filter(n => n.is_alive !== false).length;
                const totalNodes = data.total_nodes || data.nodes.length;
                
                document.getElementById('totalNodes').textContent = activeNodes + ' / ' + totalNodes;
                document.getElementById('sinkId').textContent = data.sink_id || '-';
                document.getElementById('version').textContent = data.version || '-';
                
                const pdr = data.pdr.toFixed(1);
                document.getElementById('pdr').textContent = pdr + '%';
                
                const pdrBadge = document.getElementById('pdrStatus');
                if (pdr >= 90) {
                    pdrBadge.textContent = 'Excellent';
                    pdrBadge.className = 'status-badge status-good';
                } else if (pdr >= 70) {
                    pdrBadge.textContent = 'Good';
                    pdrBadge.className = 'status-badge status-warning';
                } else {
                    pdrBadge.textContent = 'Poor';
                    pdrBadge.className = 'status-badge status-danger';
                }
                
                // Calculate averages (chỉ tính node còn sống)
                const aliveNodes = data.nodes.filter(n => n.is_alive !== false);
                if (aliveNodes.length > 0) {
                    const avgEnergy = aliveNodes.reduce((sum, n) => sum + n.energy_mj, 0) / aliveNodes.length;
                    const avgTemp = aliveNodes.reduce((sum, n) => sum + n.temp_c, 0) / aliveNodes.length;
                    const avgLat = aliveNodes.reduce((sum, n) => sum + n.latency_ms, 0) / aliveNodes.length;
                    
                    document.getElementById('avgEnergy').textContent = Math.round(avgEnergy);
                    document.getElementById('avgTemp').textContent = avgTemp.toFixed(1);
                    document.getElementById('avgLatency').textContent = Math.round(avgLat);
                    
                    // Update chart
                    const now = new Date().toLocaleTimeString();
                    metricsChart.data.labels.push(now);
                    metricsChart.data.datasets[0].data.push(avgEnergy);
                    metricsChart.data.datasets[1].data.push(avgTemp);
                    metricsChart.data.datasets[2].data.push(avgLat);
                    
                    // Keep only last 20 data points
                    if (metricsChart.data.labels.length > 20) {
                        metricsChart.data.labels.shift();
                        metricsChart.data.datasets.forEach(ds => ds.data.shift());
                    }
                    
                    metricsChart.update('none');
                }
                
                // Store nodes data globally
                allNodesData = data.nodes;
                
                // Update node list with current search filter
                updateNodeList();
                
                // Update timestamp
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
                
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function updateNodeList() {
            const nodeList = document.getElementById('nodeList');
            const searchTerm = document.getElementById('nodeSearch').value.trim().toLowerCase();
            
            if (allNodesData.length === 0) {
                nodeList.innerHTML = '<div class="loading">No nodes detected</div>';
                return;
            }
            
            // Sort by node_id
            let nodes = [...allNodesData].sort((a, b) => a.node_id - b.node_id);
            
            // Filter by search term (search in node_id and cluster)
            if (searchTerm) {
                nodes = nodes.filter(node => {
                    const nodeIdStr = node.node_id.toString();
                    const clusterStr = node.cluster.toString();
                    return nodeIdStr.includes(searchTerm) || 
                           clusterStr.includes(searchTerm) ||
                           ('node ' + nodeIdStr).includes(searchTerm) ||
                           ('cluster ' + clusterStr).includes(searchTerm);
                });
            }
            
            if (nodes.length === 0) {
                nodeList.innerHTML = `<div class="loading">No nodes found for "${searchTerm}"</div>`;
                return;
            }
            
            nodeList.innerHTML = nodes.map(node => {
                const energyPercent = (node.energy_mj / 7200) * 100;
                const energyClass = energyPercent > 60 ? 'energy-high' : 
                                   energyPercent > 30 ? 'energy-medium' : 'energy-low';
                
                const timeSince = Math.round((Date.now() / 1000) - node.last_seen);
                const isDead = node.is_alive === false;
                const deadClass = isDead ? 'node-dead' : '';
                const deadBadge = isDead ? '<span class="status-badge status-danger">DEAD</span>' : '';
                
                return `
                    <div class="node-item cluster-${node.cluster} ${deadClass}">
                        <div class="node-header">
                            <span class="node-id">Node ${node.node_id}</span>
                            <span class="cluster-badge cluster-${node.cluster}-badge">Cluster ${node.cluster}</span>
                            ${deadBadge}
                        </div>
                        <div class="node-metrics">
                            <div class="metric">
                                <span class="metric-label">Energy:</span>
                                <span class="metric-value">${node.energy_mj} mJ</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Temp:</span>
                                <span class="metric-value">${node.temp_c.toFixed(1)} C</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Latency:</span>
                                <span class="metric-value">${node.latency_ms} ms</span>
                            </div>
                            <div class="metric">
                                <span class="metric-label">Packets:</span>
                                <span class="metric-value">${node.packets_received}</span>
                            </div>
                        </div>
                        <div class="energy-bar">
                            <div class="energy-fill ${energyClass}" style="width: ${energyPercent}%"></div>
                        </div>
                        <div style="font-size: 0.8em; color: #999; margin-top: 5px;">
                            Last seen: ${timeSince}s ago
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Auto refresh every 2 seconds
        setInterval(updateDashboard, 2000);
        
        // Search functionality - chỉ filter local, không fetch API
        document.getElementById('nodeSearch').addEventListener('input', function() {
            updateNodeList();  // Re-render với data hiện tại
        });
        
        // Initial load
        updateDashboard();
    </script>
</body>
</html>
